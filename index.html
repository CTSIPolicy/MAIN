  function tint(hex, amt){ var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
    function t(c){return Math.round(c+(255-c)*amt);} return 'rgb('+t(r)+','+t(g)+','+t(b)+')'; }
  function fillOf(d){ var c = catOf(d)[2];
    if(mode==='pol' && (d.pf==='minority'||d.pf==='coalition')) return tint(c,.5);
    return c; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function shortName(n){ return n.replace(/^London Borough of /,'').replace(/^Royal Borough of /,'')
    .replace(/ (Metropolitan )?(Borough|District|County|City)? ?Council$/,'').replace(/^Council of the /,'').replace(/ Corporation$/,''); }

  // ------------------------------------------------------------------- stats --
  (function(){
    var n=DATA.length, ind=0, part={}, lg=0;
    DATA.forEach(function(d){ if(d.m==='independent') ind++; d.p.forEach(function(p){part[p]=1;}); if(d.lg!=='none') lg++; });
    var tiles=[[n,'upper-tier councils'],[ind,'run an independent, in-house service'],
               [n-ind,'share, jointly run or commission their service'],[Object.keys(part).length,'named partnerships and joint services']];
    $('tsm-stats').innerHTML = tiles.map(function(t){return '<div class="tsm-stat"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>';}).join('');
  })();

  // --------------------------------------------------------------------- map --
  var svg = $('tsm-svg'), shapes = {};   // code -> [paths]
  function mk(tag, attrs, parent){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
  function addArea(g, code, d){ var p = mk('path',{d:d,'class':'a'},g); p.__code = code;
    (shapes[code] = shapes[code] || []).push(p); }
  var gMain = mk('g',{},svg);
  Object.keys(PATHS.eng).forEach(function(c){ addArea(gMain, c, PATHS.eng[c]); });
  var r = PATHS.lrect; mk('rect',{x:r[0]-3,y:r[1]-3,width:r[2]+6,height:r[3]+6,'class':'tsm-lrect'},svg);
  // London inset in the empty North Sea corner
  var IX=436, IY=16, IS=0.66;
  var gIn = mk('g',{transform:'translate('+IX+','+IY+') scale('+IS+')'},svg);
  mk('rect',{x:0,y:-22,width:300,height:262,rx:6,'class':'tsm-inset-frame'},gIn);
  var lab = mk('text',{x:8,y:-2,'class':'tsm-inset-label'},gIn); lab.textContent='London';
  Object.keys(PATHS.lon).forEach(function(c){ addArea(gIn, c, PATHS.lon[c]); });

  function paint(){
    var partners = selected ? partnersOf(byCode[selected]) : {};
    Object.keys(shapes).forEach(function(c){
      var d = byCode[c]; var f = fillOf(d), k = catOf(d)[0];
      shapes[c].forEach(function(p){
        p.setAttribute('fill', f);
        p.classList.toggle('dim', !!focusCat && k!==focusCat);
        p.classList.toggle('sel', c===selected);
        p.classList.toggle('partner', !!partners[c] && c!==selected);
        p.classList.toggle('hov', c===hovered && c!==selected);
        if(c===selected || c===hovered || partners[c]) p.parentNode.appendChild(p);
      });
    });
  }
  function partnersOf(d){ var out={}; if(!d) return out;
    d.p.forEach(function(name){ DATA.forEach(function(o){ if(o.p.indexOf(name)>=0) out[o.c]=1; }); });
    return out; }

  // ------------------------------------------------------------------ legend --
  function drawModes(){
    $('tsm-modes').innerHTML = ORDER.map(function(m){
      return '<button type="button" data-m="'+m+'" aria-pressed="'+(m===mode)+'">'+MODES[m].label+'</button>'; }).join('');
  }
  function drawLegend(){
    var counts={}; DATA.forEach(function(d){ var k=catOf(d)[0]; counts[k]=(counts[k]||0)+1; });
    $('tsm-leg').innerHTML = MODES[mode].cats.filter(function(c){return counts[c[0]];}).map(function(c){
      return '<button type="button" data-k="'+esc(c[0])+'" aria-pressed="'+(focusCat===c[0])+'"><i style="background:'+c[2]+'"></i>'+esc(c[1])+' <em>'+counts[c[0]]+'</em></button>'; }).join('');
    $('tsm-legnote').textContent = MODES[mode].note || '';
    $('tsm-legnote').style.display = MODES[mode].note ? '' : 'none';
  }
  $('tsm-modes').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
    mode=b.getAttribute('data-m'); focusCat=null; drawModes(); drawLegend(); paint(); });
  $('tsm-leg').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
    var k=b.getAttribute('data-k'); focusCat = focusCat===k ? null : k; drawLegend(); paint(); });

  // ------------------------------------------------------------------- panel --
  function pill(m, d){ var c=catOf(d,m); var col=c[2];
    if(m==='pol' && (d.pf==='minority'||d.pf==='coalition')) col=tint(col,.5);
    return '<span class="tsm-pill"><i style="background:'+col+'"></i>'; }
  function showPanel(){
    var d = selected && byCode[selected], el=$('tsm-panel');
    if(!d){
      el.innerHTML = '<div class="tsm-empty"><h3>Select a council</h3><p>Click or tap any council on the map, search by name, or pick one from the table to see how its Trading Standards service is delivered.</p><p>Councils that share or jointly run a service are outlined together when you select one of them.</p></div>';
      return;
    }
    var h = '<button type="button" class="tsm-close" aria-label="Clear selection">×</button>'+
      '<h3>'+esc(d.n)+'</h3><p class="tsm-sub">'+esc(d.t)+'</p><dl>'+
      '<dt>Service model</dt><dd>'+pill('model',d)+esc(d.mt)+'</span></dd>';
    if(d.p.length){
      h += '<dt>Partnership</dt><dd>'+d.p.map(esc).join('<br>');
      var others = Object.keys(partnersOf(d)).filter(function(c){return c!==d.c;});
      if(others.length) h += '<div class="tsm-chips">'+others.map(function(c){
        return '<button type="button" class="tsm-chip" data-c="'+c+'">'+esc(shortName(byCode[c].n))+'</button>'; }).join('')+'</div>';
      h += '</dd>';
    }
    if(d.sw) h += '<dt>Arrangement</dt><dd>'+esc(d.sw)+'</dd>';
    if((d.pd && d.pd!=='N/A') || d.ps.length){
      h += '<dt>Where the service sits</dt><dd>'+(d.pd==='N/A'?'':esc(d.pd));
      if(d.ps.length) h += '<br>'+d.ps.map(function(u,i){ return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Source'+(d.ps.length>1?' '+(i+1):'')+'</a>'; }).join(' · ');
      h += '</dd>';
    }
    h += '<dt>Political control</dt><dd>'+pill('pol',d)+esc(d.pol)+'</span></dd>'+
         '<dt>Reorganisation and devolution</dt><dd>'+pill('lgr',d)+esc(catOf(d,'lgr')[1])+'</span><br>'+esc(d.lt)+'</dd></dl>';
    el.innerHTML = h;
  }
  $('tsm-panel').addEventListener('click', function(e){
    if(e.target.closest('.tsm-close')) return select(null);
    var c=e.target.closest('.tsm-chip'); if(c) select(c.getAttribute('data-c'));
  });
  function select(code){ selected = code; paint(); showPanel(); }

  // ----------------------------------------------------------- map pointer --
  var tip=$('tsm-tip');
  svg.addEventListener('mousemove', function(e){
    var c = e.target.__code;
    if(c!==hovered){ hovered=c||null; paint(); }
    if(!c){ tip.style.display='none'; return; }
    var d=byCode[c];
    tip.innerHTML='<b>'+esc(d.n)+'</b>'+esc(catOf(d)[1])+(mode==='pol'?' ('+esc(d.pf==='noc'?'NOC':d.pf)+')':'');
    tip.style.display='block';
    var x=e.clientX+14, y=e.clientY+14, w=tip.offsetWidth, h=tip.offsetHeight;
    if(x+w>window.innerWidth-8) x=e.clientX-w-14;
    if(y+h>window.innerHeight-8) y=e.clientY-h-14;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
  svg.addEventListener('mouseleave', function(){ hovered=null; tip.style.display='none'; paint(); });
  svg.addEventListener('click', function(e){ var c=e.target.__code; select(c && c!==selected ? c : null); });

  // ------------------------------------------------------------------ search --
  var q=$('tsm-q'), ql=$('tsm-qlist'), hits=[], hi=-1;
  function closeList(){ ql.hidden=true; q.setAttribute('aria-expanded','false'); hi=-1; }
  function renderList(){
    ql.innerHTML = hits.map(function(d,i){ return '<li role="option" id="tsm-o'+i+'" data-c="'+d.c+'" aria-selected="'+(i===hi)+'">'+esc(d.n)+'</li>'; }).join('');
    ql.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
    if(hi>=0) q.setAttribute('aria-activedescendant','tsm-o'+hi); else q.removeAttribute('aria-activedescendant');
  }
  q.addEventListener('input', function(){
    var s=q.value.trim().toLowerCase(); hi=-1;
    hits = s.length<2 ? [] : DATA.filter(function(d){ return d.n.toLowerCase().indexOf(s)>=0; }).slice(0,12);
    renderList();
  });
  q.addEventListener('keydown', function(e){
    if(ql.hidden) return;
    if(e.key==='ArrowDown'){ hi=Math.min(hi+1,hits.length-1); renderList(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); renderList(); e.preventDefault(); }
    else if(e.key==='Enter'){ var d=hits[hi>=0?hi:0]; if(d){ pick(d.c); e.preventDefault(); } }
    else if(e.key==='Escape'){ closeList(); }
  });
  ql.addEventListener('mousedown', function(e){ var li=e.target.closest('li'); if(li){ e.preventDefault(); pick(li.getAttribute('data-c')); } });
  q.addEventListener('blur', function(){ setTimeout(closeList,100); });
  function pick(c){ q.value=byCode[c].n; closeList(); select(c);
    if(window.innerWidth<=820) $('tsm-panel').scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // ------------------------------------------------------------------- table --
  var COLS=[['n','Council'],['t','Type'],['mt','Service model'],['p','Partnership'],['pol','Political control'],['lg','Reorganisation']];
  var sortKey='n', sortDir=1;
  function cell(d,k){ if(k==='p') return d.p.join('; '); if(k==='lg') return catOf(d,'lgr')[1]; return d[k]; }
  function drawTable(){
    var rows = DATA.slice().sort(function(a,b){ var x=String(cell(a,sortKey)), y=String(cell(b,sortKey));
      return (x<y?-1:x>y?1:0)*sortDir || (a.n<b.n?-1:1); });
    $('tsm-table').innerHTML = '<thead><tr>'+COLS.map(function(c){
      var s = c[0]===sortKey ? (sortDir>0?'ascending':'descending') : 'none';
      return '<th scope="col" aria-sort="'+s+'"><button type="button" data-k="'+c[0]+'">'+c[1]+(c[0]===sortKey?(sortDir>0?' ▲':' ▼'):'')+'</button></th>'; }).join('')+'</tr></thead><tbody>'+
      rows.map(function(d){ return '<tr><td><button type="button" data-c="'+d.c+'">'+esc(d.n)+'</button></td>'+
        COLS.slice(1).map(function(c){ return '<td>'+esc(cell(d,c[0]))+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody>';
  }
  $('tsm-table').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-k')){ var k=b.getAttribute('data-k'); sortDir = k===sortKey ? -sortDir : 1; sortKey=k; drawTable(); return; }
    select(b.getAttribute('data-c'));
    $('tsm-svg').scrollIntoView({behavior:'smooth',block:'center'});
  });

  drawModes(); drawLegend(); paint(); showPanel(); drawTable();
})();
</script>
